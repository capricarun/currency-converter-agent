<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Currenzy — your currency agent</title>
<meta name="description" content="A conversational currency agent. Ask in plain language; it fetches live rates, compares transfer routes, reads the 90-day trend and tells you what it would do.">
<meta name="theme-color" content="#0B0F0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Currenzy">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%230B0F0E'/%3E%3Ccircle cx='50' cy='50' r='23' fill='none' stroke='%2334E39B' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2334E39B'/%3E%3C/svg%3E">
<style>
/* ════════════════════════════════════════════════════════════
   CURRENZY AGENT — tokens
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#0B0F0E; --stage:#070A09;
  --surface:#141A19; --surface-2:#1B2322; --surface-3:#232D2B;
  --line:#26302E; --line-2:#1D2624;
  --txt:#EAF2EF; --dim:#93A5A0; --faint:#61736E;
  --accent:#34E39B; --accent-2:#12B981; --accent-ink:#04150E;
  --accent-soft:rgba(52,227,155,.11); --accent-line:rgba(52,227,155,.24);
  --warn:#FFB454; --warn-soft:rgba(255,180,84,.12);
  --bad:#FF7A7A; --violet:#B9A6FF;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 18px 46px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#F5F8F6; --stage:#E3EAE6;
  --surface:#FFFFFF; --surface-2:#EEF3F1; --surface-3:#E3EAE7;
  --line:#DFE7E3; --line-2:#EAF0ED;
  --txt:#0C1614; --dim:#5B6D68; --faint:#8A9995;
  --accent:#0BA06B; --accent-2:#078356; --accent-ink:#FFFFFF;
  --accent-soft:rgba(11,160,107,.10); --accent-line:rgba(11,160,107,.20);
  --warn:#A96200; --warn-soft:rgba(169,98,0,.10);
  --bad:#D93A3A; --violet:#6C4FD8;
  --shadow:0 18px 46px -18px rgba(12,22,20,.26);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--stage);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── shell ── */
#stage{height:100dvh;display:flex;align-items:center;justify-content:center}
#app{
  position:relative;width:100%;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);
}
@media(min-width:600px){
  #stage{background:
    radial-gradient(58% 46% at 18% 0%, rgba(52,227,155,.10), transparent 70%),
    radial-gradient(46% 38% at 92% 100%, rgba(18,185,129,.08), transparent 72%), var(--stage);}
  #app{width:424px;height:min(880px,94dvh);border-radius:38px;
       box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.06);padding-top:0}
}

/* ── header: the agent's identity ── */
.topbar{
  display:flex;align-items:center;gap:11px;padding:12px 16px 11px;flex-shrink:0;
  border-bottom:1px solid var(--line-2);background:var(--bg);z-index:5;
}
.avatar{
  width:38px;height:38px;border-radius:13px;flex-shrink:0;position:relative;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;box-shadow:0 4px 16px -5px var(--accent);
}
.avatar svg{color:var(--accent-ink)}
.avatar::after{
  content:"";position:absolute;inset:-3px;border-radius:16px;
  border:2px solid var(--accent);opacity:0;
}
.avatar.busy::after{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}

.who{flex:1;min-width:0}
.who b{display:block;font-size:15.5px;font-weight:670;letter-spacing:-.025em;line-height:1.2}
.who span{
  display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);margin-top:2px;
}
.who .led{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.who .led.stale{background:var(--warn)}
.iconbtn{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
  background:var(--surface-2);color:var(--dim);transition:background .16s,color .16s,transform .12s;
}
.iconbtn:active{transform:scale(.92)}
.iconbtn:hover{color:var(--txt)}

/* ── thread ── */
.thread{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 14px 8px;
  display:flex;flex-direction:column;gap:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.thread::-webkit-scrollbar{display:none}

.turn{display:flex;gap:9px;align-items:flex-start;animation:rise .34s cubic-bezier(.3,1,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.turn.me{justify-content:flex-end}
.mini{
  width:26px;height:26px;border-radius:9px;flex-shrink:0;margin-top:2px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
}
.mini svg{color:var(--accent-ink)}
.stack{min-width:0;max-width:84%;display:flex;flex-direction:column;gap:9px}
.turn.me .stack{max-width:82%;align-items:flex-end}

.bubble{
  background:var(--surface);border:1px solid var(--line-2);border-radius:18px 18px 18px 6px;
  padding:11px 14px;font-size:14.5px;line-height:1.55;color:var(--txt);
}
.turn.me .bubble{
  background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  border-color:transparent;border-radius:18px 18px 6px 18px;font-weight:520;
}
.bubble p{margin:0 0 9px}
.bubble p:last-child{margin:0}
.bubble b{font-weight:660}
.bubble .hl{color:var(--accent);font-weight:660}
.turn.me .bubble .hl{color:inherit}
.cursor{
  display:inline-block;width:7px;height:14px;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:blink .9s steps(2) infinite;border-radius:1px;
}
@keyframes blink{50%{opacity:0}}

/* ── reasoning trace ── */
.trace{
  background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
  padding:9px 11px;font-family:var(--mono);font-size:11px;line-height:1.5;
}
.trace .step{display:flex;align-items:flex-start;gap:8px;padding:2.5px 0;color:var(--faint)}
.trace .step .ic{width:12px;flex-shrink:0;margin-top:2px;display:grid;place-items:center}
.trace .step .bd{flex:1;min-width:0;word-break:break-word}
.trace .step.run{color:var(--violet)}
.trace .step.done{color:var(--dim)}
.trace .step .nm{color:inherit}
.trace .step .rs{color:var(--faint);opacity:.85}
.trace .step.done .rs{color:var(--accent);opacity:1}
.spin{
  width:9px;height:9px;border:1.4px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{width:10px;height:10px;color:var(--accent)}

/* typing dots */
.dots{display:flex;gap:4px;padding:13px 15px;background:var(--surface);
      border:1px solid var(--line-2);border-radius:18px 18px 18px 6px;width:fit-content}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bob 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes bob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ════════════════════════════════════════════════════════════
   RICH BLOCKS the agent attaches to its answers
   ════════════════════════════════════════════════════════════ */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;overflow:hidden}

/* conversion result */
.conv{padding:15px 16px}
.conv .lede{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:9px}
.conv .lede .fl{font-size:15px;line-height:1}
.conv .out{font-size:31px;font-weight:730;letter-spacing:-.04em;line-height:1.05;color:var(--accent)}
.conv .sub{font-size:12px;color:var(--faint);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.conv .sub b{color:var(--dim);font-weight:600}

/* route comparison */
.routes{padding:14px 16px}
.routes .rh{font-size:12px;font-weight:640;color:var(--dim);margin-bottom:11px;
             display:flex;align-items:center;gap:7px}
.routes .rh .pill{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;flex-shrink:0;
  white-space:nowrap;background:var(--accent-soft);color:var(--accent);padding:3px 6px;border-radius:5px}
.route{display:flex;align-items:center;gap:10px;padding:8px 0}
.route + .route{border-top:1px solid var(--line-2)}
.route .ri{flex:1;min-width:0}
.route .rn{display:block;font-size:13px;font-weight:600}
.route .rd{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
.route .bar{display:block;height:4px;border-radius:3px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.route .bar i{display:block;height:100%;border-radius:3px;background:var(--accent);
              transition:width .8s cubic-bezier(.3,1,.5,1)}
.route.mid .bar i{background:var(--warn)}
.route.worst .bar i{background:var(--bad)}
.route .rv{text-align:right;flex-shrink:0}
.route .rm{display:block;font-size:13.5px;font-weight:670;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.route .rl{display:block;font-size:10px;font-weight:640;color:var(--bad);font-variant-numeric:tabular-nums}
.route.best .rm{color:var(--accent)}
.pickme{
  display:flex;align-items:center;gap:7px;margin-top:11px;padding:9px 11px;border-radius:12px;
  background:var(--accent-soft);border:1px solid var(--accent-line);font-size:12px;color:var(--accent);
  font-weight:560;line-height:1.4;
}

/* trend */
.trend{padding:14px 16px}
.trend .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
.trend .tv{font-size:24px;font-weight:720;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.trend .tp{font-size:12px;font-weight:640}
.trend .tp.up{color:var(--accent)} .trend .tp.dn{color:var(--bad)}
.trend .ts{font-size:11px;color:var(--faint);margin-bottom:11px}
.trend svg{display:block;width:100%;height:74px;overflow:visible}
.trend .ax{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--faint);
           font-variant-numeric:tabular-nums}
.trend .ax b{color:var(--dim);font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--surface-3);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;
         background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .9s cubic-bezier(.3,1,.5,1)}
.mlab{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--faint)}

/* multi-currency grid */
.grid{padding:6px 8px}
.grow{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:12px}
.grow + .grow{border-top:1px solid var(--line-2)}
.grow .gf{font-size:20px;line-height:1;flex-shrink:0}
.grow .gi{flex:1;min-width:0}
.grow .gc{display:block;font-size:13px;font-weight:640}
.grow .gn{display:block;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gv{text-align:right;flex-shrink:0}
.grow .ga{display:block;font-size:15px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.grow .gr{display:block;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

/* top-5 destination recommendations */
.sugg{padding:14px 16px 8px}
.sugg .sh{font-size:12px;font-weight:640;color:var(--dim);margin-bottom:3px;
          display:flex;align-items:center;gap:7px}
.sugg .sh .pill{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;flex-shrink:0;
  white-space:nowrap;background:var(--accent-soft);color:var(--accent);padding:3px 6px;border-radius:5px}
.sugg .ss{font-size:11px;color:var(--faint);line-height:1.45;margin-bottom:10px}
.srow{
  display:flex;align-items:center;gap:11px;padding:9px 8px;width:100%;text-align:left;
  border-radius:12px;transition:background .15s,transform .1s;min-height:52px;
}
.srow:hover{background:var(--surface-2)}
.srow:active{transform:scale(.985);background:var(--surface-3)}
.srow .sf{font-size:20px;line-height:1;flex-shrink:0;width:24px;text-align:center}
.srow .si{flex:1;min-width:0}
.srow .sc{display:block;font-size:13px;font-weight:650}
.srow .sn{display:block;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sm{display:block;height:4px;border-radius:2px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.srow .sm i{display:block;height:100%;border-radius:2px;background:var(--accent);
            transition:width .8s cubic-bezier(.3,1,.5,1)}
.srow.mid .sm i{background:var(--warn)}
.srow.low .sm i{background:var(--faint)}
.srow .sv{text-align:right;flex-shrink:0}
.srow .sa{display:block;font-size:14.5px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.srow .sp{display:block;font-size:10px;font-weight:620;font-variant-numeric:tabular-nums}
.srow .sp.hi{color:var(--accent)} .srow .sp.mid{color:var(--warn)} .srow .sp.low{color:var(--faint)}
.sugg .sfoot{font-size:10.5px;color:var(--faint);padding:9px 8px 4px;border-top:1px solid var(--line-2);margin-top:4px;line-height:1.45}

/* verdict callout */
.verdict{
  display:flex;gap:10px;padding:12px 14px;border-radius:16px;
  background:var(--accent-soft);border:1px solid var(--accent-line);
}
.verdict.warn{background:var(--warn-soft);border-color:rgba(255,180,84,.28)}
.verdict .vi{flex-shrink:0;color:var(--accent);margin-top:1px}
.verdict.warn .vi{color:var(--warn)}
.verdict .vt{font-size:13px;line-height:1.5;color:var(--txt)}
.verdict .vt b{font-weight:660}

/* suggestion chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:550;color:var(--dim);min-height:36px;
  transition:all .16s,transform .1s;line-height:1.2;display:inline-flex;align-items:center;
}
.chip:active{transform:scale(.95)}
.chip:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}

/* ── composer ── */
.composer{
  flex-shrink:0;padding:10px 12px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line-2);background:var(--bg);
}
.inputrow{display:flex;align-items:flex-end;gap:9px}
.field{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;
  padding:10px 14px;transition:border-color .18s;
}
.field:focus-within{border-color:var(--accent-line)}
.field input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:15px}
.field input::placeholder{color:var(--faint)}
.send{
  width:44px;height:44px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  box-shadow:0 5px 16px -6px var(--accent);transition:transform .12s,opacity .18s;
}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.35;box-shadow:none;cursor:default}

/* ── sheet ── */
.scrim{
  position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-end;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-height:82%;background:var(--surface);border-radius:26px 26px 0 0;
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,1.05,.5,1);padding-bottom:env(safe-area-inset-bottom);
}
.scrim.on .sheet{transform:none}
.sheet-h{padding:12px 18px 14px;flex-shrink:0}
.grab{width:38px;height:4px;border-radius:2px;background:var(--surface-3);margin:0 auto 13px}
.sheet-h h2{font-size:17px;font-weight:690;margin:0 0 4px;letter-spacing:-.028em}
.sheet-h p{margin:0;font-size:12.5px;color:var(--dim)}
.sheet-b{flex:1;overflow-y:auto;padding:0 14px 18px;scrollbar-width:none}
.sheet-b::-webkit-scrollbar{display:none}
.exl{padding:11px 13px;border-radius:13px;background:var(--surface-2);margin-bottom:7px;
     font-size:13.5px;color:var(--txt);width:100%;text-align:left;transition:background .15s}
.exl:active{background:var(--surface-3)}
.exl span{display:block;font-size:11px;color:var(--faint);margin-top:2px}
.exh{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
     color:var(--faint);padding:14px 4px 7px}

.toast{
  position:absolute;left:50%;bottom:88px;transform:translate(-50%,12px);z-index:40;
  background:var(--surface-3);border-radius:13px;padding:10px 16px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;box-shadow:var(--shadow);max-width:86%;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
<div id="app">

  <header class="topbar">
    <div class="avatar" id="avatar">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
    </div>
    <div class="who">
      <b>Currenzy</b>
      <span><i class="led" id="led"></i><span id="status">waking up…</span></span>
    </div>
    <button class="iconbtn" id="helpBtn" aria-label="What can it do">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.2a2.7 2.7 0 1 1 3.4 3.3c-.5.2-.8.7-.8 1.3v.4"/><circle cx="12" cy="17.4" r="1" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="iconbtn" id="themeBtn" aria-label="Switch theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
    </button>
    <button class="iconbtn" id="resetBtn" aria-label="Start over">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3.5V8h4.5"/></svg>
    </button>
  </header>

  <main class="thread" id="thread" aria-live="polite" aria-label="Conversation"></main>

  <div class="composer">
    <form class="inputrow" id="form">
      <label class="field">
        <span class="sr">Ask Currenzy</span>
        <input id="input" placeholder="Ask me anything about currency…" autocomplete="off" spellcheck="false" enterkeyhint="send">
      </label>

async function loadRates(base) {

function rateOf(a, b) {
  const r = fx.rates, base = fx.base;
  const f = a === base ? 1 : r[a], t = b === base ? 1 : r[b];
  if (!f || !t) return null;
  return t / f;
}

const seriesCache = {};
async function history(from, to) {
  const key = from + to;
  if (seriesCache[key]) return seriesCache[key];
  const start = new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10);
  let vals = null;
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 6500);
    const res = await fetch(`https://api.frankfurter.dev/v1/${start}..?base=${from}&symbols=${to}`, { signal:c.signal });
    clearTimeout(t);
    if (res.ok) {
      const j = await res.json();
      const v = Object.keys(j.rates || {}).sort().map(d => j.rates[d][to]).filter(x => typeof x === "number");
      if (v.length > 12) vals = v;
    }
  } catch (e) {}
  const out = { vals: vals || synth(from, to, rateOf(from, to) || 1), live: !!vals };
  seriesCache[key] = out;
  return out;
}
function synth(from, to, rate) {
  let seed = 0; const k = from + to;
  for (let i = 0; i < k.length; i++) seed = (seed * 31 + k.charCodeAt(i)) % 100000;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const out = []; let v = 1;
  for (let i = 0; i < 90; i++) { v = v * (1 + (rnd() - 0.5) * 0.012) + (1 - v) * 0.02; out.push(v); }
  const k2 = rate / out[out.length - 1];
  return out.map(x => x * k2);
}

/* Where today sits inside each pair's own 90-day range — one request for all
   five destinations, so the ranking costs a single round trip. */
async function multiRange(from, codes) {
  const start = new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10);
  const out = {};
  let live = false;
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 7000);
    const res = await fetch(`https://api.frankfurter.dev/v1/${start}..?base=${from}&symbols=${codes.join(",")}`, { signal:c.signal });
    clearTimeout(t);
    if (res.ok) {
      const j = await res.json();
      const days = Object.keys(j.rates || {}).sort();
      codes.forEach(code => {
        const v = days.map(d => j.rates[d][code]).filter(x => typeof x === "number");
        if (v.length > 12) { out[code] = v; live = true; }
      });
    }
  } catch (e) {}
  codes.forEach(code => {
    if (!out[code]) out[code] = synth(from, code, rateOf(from, code) || 1);
  });
  return { series: out, live };
}
function position(vals, now) {
  const lo = Math.min(...vals), hi = Math.max(...vals);
  return clamp(Math.round(((now - lo) / ((hi - lo) || 1)) * 100), 0, 100);
}

/* ── formatting ─────────────────────────────────────────────── */
const ZERO_DEC = ["JPY","KRW","VND","IDR","CLP","COP","HUF","ISK"];
function money(n, code) {
  if (n == null || !isFinite(n)) return "—";
  if (Math.abs(n) >= 1e9) return n.toLocaleString(undefined, { notation:"compact", maximumFractionDigits:2 });
  const d = ZERO_DEC.includes(code) ? 0 : (Math.abs(n) >= 1 || n === 0 ? 2 : 4);
  return n.toLocaleString(undefined, { minimumFractionDigits:d, maximumFractionDigits:d });
}
const cash = (n, code) => (CUR[code] ? CUR[code].sym : "") + money(n, code);
function rateStr(n) {
  if (!isFinite(n)) return "—";
  return n.toLocaleString(undefined, n < 1 ? { minimumFractionDigits:4, maximumFractionDigits:5 }
                                           : { minimumFractionDigits:2, maximumFractionDigits:4 });
}
function rangeStr(n) {
  if (!isFinite(n)) return "—";
  const d = n >= 100 ? 2 : n >= 1 ? 3 : 5;
  return n.toLocaleString(undefined, { minimumFractionDigits:d, maximumFractionDigits:d });
}
const plain = n => Math.abs(n % 1) < 1e-9 ? Math.round(n).toLocaleString() : money(n, "USD");
function ago(d) {
  if (!d) return "indicative snapshot";
  const m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 2) return "updated just now";
  if (m < 60) return "updated " + m + " min ago";
  const h = Math.round(m / 60);
  if (h < 24) return "updated " + h + "h ago";
  return "updated " + Math.round(h / 24) + "d ago";
}

/* ══════════════════════════════════════════════════════════════
   UNDERSTANDING — currencies, amounts, intent

function findCurrencies(text) {
  const t = " " + text.toLowerCase() + " ";
  const taken = new Array(t.length).fill(false);
  const hits = [];
  for (const { p, code } of LEX) {
    let from = 0;
    while (true) {
      const i = t.indexOf(p, from);
      if (i < 0) break;
      from = i + 1;
      if (!SYMBOLIC.test(p)) {                       // words need real boundaries
        const before = t[i - 1], after = t[i + p.length];
        if (/[a-z0-9]/.test(before || "") || /[a-z0-9]/.test(after || "")) continue;
      }
      let clash = false;
      for (let k = i; k < i + p.length; k++) if (taken[k]) { clash = true; break; }
      if (clash) continue;
      for (let k = i; k < i + p.length; k++) taken[k] = true;
      hits.push({ code, at:i });
    }
  }
  hits.sort((a, b) => a.at - b.at);
  const seen = new Set(), out = [];
  for (const h of hits) if (!seen.has(h.code)) { seen.add(h.code); out.push(h); }
  return out;
}

const MULT = { k:1e3, thousand:1e3, m:1e6, million:1e6, bn:1e9, billion:1e9, lakh:1e5, lac:1e5, crore:1e7 };
function findAmount(text) {
  /* strip durations first, so "last 90 days" is never read as an amount */
  const t = text.toLowerCase()
    .replace(/\b\d+\s*[-–]?\s*(day|days|week|weeks|month|months|year|years|yr|yrs)\b/g, " ")
    .replace(/\b(next|last|past)\s+\d+\b/g, " ");
  const m = t.match(/(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?)\s*(k|m|bn|thousand|million|billion|lakh|lac|crore)?\b/);
  if (!m) return null;
  const n = parseFloat(m[1].replace(/,/g, ""));
  if (!isFinite(n)) return null;
  const mult = m[2] ? MULT[m[2]] || 1 : 1;
  return n * mult;
}

/* Which currency is the source and which the destination */
function orient(codes, text) {
  const t = " " + text.toLowerCase() + " ";
  if (codes.length === 0) return {};
  if (codes.length === 1) return { one: codes[0].code };
  const sep = [" to ", " into ", " in ", "->", "→", " for "]
    .map(s => ({ s, i: t.indexOf(s) })).filter(x => x.i > -1).sort((a, b) => a.i - b.i)[0];
  if (sep) {
    const before = codes.filter(c => c.at < sep.i);
    const after  = codes.filter(c => c.at > sep.i);
    if (before.length && after.length) {
      return { from: before[before.length - 1].code, to: after[0].code, others: after.slice(1).map(c => c.code) };
    }
  }
  return { from: codes[0].code, to: codes[1].code, others: codes.slice(2).map(c => c.code) };
}

  watchDel:/\b(unwatch|untrack|stop (watching|tracking)|remove|drop)\b/,
  timing:  /\b(good time|right time|should i (wait|send|convert|exchange|transfer|buy|move)|worth waiting|now or|is it a good|better to wait|timing|when should)\b/,
  route:   /\b(cheapest|best way|actually (get|receive|land)|what will i (get|receive)|how much (will|would) i (get|receive)|lands?|fees?|fee\b|cost|costs|markup|bureau|western union|which (way|route|method)|hidden)\b/,
  trend:   /\b(trend|history|historical|moved|moving|going up|going down|chart|graph|over the last|past \d|high|low|range|volatile)\b/,
  rate:    /\b(rate|exchange rate|worth|how much is (one|1|a)\b)\b/,
  suggest: /\b(where (should|shall|do|does|can|would)|suggest|recommend|best (currency|place|option|country)|top (5|five)|which currency|go(es)? furthest|my options|what are my options)\b/,
  greet:   /^\s*(hi|hey|hello|yo|good (morning|afternoon|evening)|sup|namaste)\b/
};

function understand(text) {
  const raw = text.trim();
  const t = raw.toLowerCase();
  const codes = findCurrencies(raw);
  const amount = findAmount(raw);
  const o = orient(codes, raw);

  let intent = "unknown";
  if (RX.help.test(t)) intent = "help";
  else if (RX.showList.test(t) && !RX.watchAdd.test(t)) intent = "showList";
  else if (RX.watchDel.test(t) && codes.length) intent = "watchDel";
  else if (RX.watchAdd.test(t) && codes.length && !RX.route.test(t)) intent = "watchAdd";
  else if (RX.suggest.test(t)) intent = "suggest";
  else if (RX.timing.test(t)) intent = "timing";
  else if (RX.route.test(t)) intent = "route";
  else if (RX.trend.test(t)) intent = "trend";
  else if (codes.length >= 3 || /\bcompare\b/.test(t)) intent = "compare";
  else if (amount != null || codes.length) intent = "convert";
  else if (RX.rate.test(t)) intent = "rate";
  else if (RX.greet.test(t)) intent = "greet";

  return { raw, intent, amount, codes: codes.map(c => c.code), ...o };
}

/* Fill the gaps from what we already talked about — this is the memory. */
function resolve(u) {
  const c = S.ctx;
  let from = u.from, to = u.to;
  if (!from && !to && u.one) {
    /* one currency named: usually the new destination, unless they said "from" */
    if (/\bfrom\b/.test(u.raw.toLowerCase())) { from = u.one; to = c.to === u.one ? c.from : c.to; }
    else { to = u.one; from = c.from === u.one ? c.to : c.from; }
  }
  from = from || c.from; to = to || c.to;
  if (from === to) to = c.to !== from ? c.to : (from === "USD" ? "INR" : "USD");
  const amount = u.amount != null ? u.amount : c.amount;
  return { from, to, amount, others: u.others || [] };
}

const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>';
const MINI = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>';

const el = (cls, html) => { const n = document.createElement("div"); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const thread = () => $("#thread");
let pinned = true;
function scroll(force) {
  const t = thread();
  if (pinned || force) t.scrollTop = t.scrollHeight;
}

function addUser(text) {

/* An agent turn: avatar, then a stack it fills with trace, prose and blocks. */
function beginAgent() {
  const turn = el("turn", `<div class="mini">${MINI}</div>`);
  const stack = el("stack");
  turn.appendChild(stack);
  thread().appendChild(turn);
  scroll();

  let traceEl = null;
  return {
    async step(name, result, ms) {
      if (!traceEl) { traceEl = el("trace"); stack.appendChild(traceEl); }
      const row = el("step run", `<span class="ic"><span class="spin"></span></span><span class="bd"><span class="nm">${esc(name)}</span></span>`);
      traceEl.appendChild(row); scroll();
      await wait(ms == null ? 170 + Math.random() * 130 : ms);
      row.className = "step done";
      row.innerHTML = `<span class="ic">${TICK}</span><span class="bd"><span class="nm">${esc(name)}</span> <span class="rs">→ ${esc(result)}</span></span>`;
      scroll();
    },
    async say(md) { await stream(stack, md); },
    attach(node) { stack.appendChild(node); scroll(); },
    chips(list) {
      if (!list || !list.length) return;
      const row = el("chips", list.map(c => `<button class="chip">${esc(c)}</button>`).join(""));
      row.addEventListener("click", e => {
        const b = e.target.closest(".chip");
        if (b && !S.busy) { buzz(); turn_(b.textContent); }
      });
      stack.appendChild(row); scroll();
    }
  };
}

/* Word-by-word reveal. *bold* and ~accent~ survive the streaming because the
   text is tokenised before it is written, never sliced mid-tag. */
function tokens(md) {
  const out = [];
  md.split(/(\*[^*]+\*|~[^~]+~)/g).filter(Boolean).forEach(p => {
    let cls = "", text = p;
    if (p.length > 2 && p[0] === "*" && p[p.length - 1] === "*") { cls = "b"; text = p.slice(1, -1); }
    else if (p.length > 2 && p[0] === "~" && p[p.length - 1] === "~") { cls = "hl"; text = p.slice(1, -1); }
    text.split(/(\s+)/).forEach(w => { if (w !== "") out.push({ w, cls }); });
  });
  return out;
}
/* Frame-driven rather than one timer per word: a per-token await plus a scroll
   (which forces a reflow) made a long answer take ten seconds on a real device.
   This reveals however many tokens the elapsed time calls for, once per frame,
   and finishes inside a fixed budget no matter how long the text is. */
async function stream(stack, md) {
  const bubble = el("bubble");
  stack.appendChild(bubble);

  const flat = [];
  md.split("\n\n").forEach((para, pi) => tokens(para).forEach(t => flat.push({ ...t, pi })));
  const ps = [];                                  // paragraphs created on first use
  const cur = document.createElement("span");
  cur.className = "cursor";

  const DUR = clamp(flat.length * 8, 260, 850);
  const t0 = performance.now();
  let i = 0;

  const push = () => {
    const tk = flat[i++];
    let p = ps[tk.pi];
    if (!p) { p = ps[tk.pi] = document.createElement("p"); bubble.appendChild(p); }
    let node;
    if (tk.cls === "b") { node = document.createElement("b"); node.textContent = tk.w; }
    else if (tk.cls === "hl") { node = document.createElement("span"); node.className = "hl"; node.textContent = tk.w; }
    else node = document.createTextNode(tk.w);
    p.appendChild(node);
    p.appendChild(cur);                           // cursor trails the newest word
  };

  await new Promise(done => {
    let ended = false;
    /* rAF is paused in a backgrounded tab. Without this the answer would
       freeze mid-sentence and the composer would never unlock. */
    const finish = () => {
      if (ended) return;
      ended = true;
      clearTimeout(guard);
      while (i < flat.length) push();
      cur.remove(); scroll(); done();
    };
    const guard = setTimeout(finish, DUR + 600);
    (function frame(now) {
      if (ended) return;
      const target = Math.min(flat.length, Math.ceil(((now - t0) / DUR) * flat.length));
      while (i < target) push();
      scroll();
      if (i >= flat.length) finish();
      else requestAnimationFrame(frame);
    })(performance.now());
  });
}

function routesCard(to, converted) {
  const rows = ROUTES.map(rt => {

}

function trendCard(from, to, vals, live) {
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const now = vals[vals.length - 1], first = vals[0];
  const chg = ((now - first) / first) * 100;
  const pos = clamp(Math.round(((now - lo) / ((hi - lo) || 1)) * 100), 0, 100);
  const W = 300, H = 74, span = (hi - lo) || 1;
  const pt = (v, i) => [(i / (vals.length - 1)) * W, H - ((v - lo) / span) * (H - 10) - 5];
  const d = vals.map((v, i) => { const [x, y] = pt(v, i); return `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`; }).join(" ");
  const [ex, ey] = pt(now, vals.length - 1);
  return el("card trend", `
    <div class="th">
      <span class="tv">${rateStr(now)}</span>
      <span class="tp ${chg >= 0 ? "up" : "dn"}">${chg >= 0 ? "▲" : "▼"} ${Math.abs(chg).toFixed(2)}%</span>
    </div>
    <div class="ts">${esc(from)} → ${esc(to)} · 90 days${live ? " · ECB reference rates" : " · illustrative"}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="90-day trend">
      <defs><linearGradient id="g${from}${to}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".26"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <path d="${d} L${W},${H} L0,${H} Z" fill="url(#g${from}${to})"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3" fill="var(--accent)"/>
    </svg>
    <div class="ax"><span>Low <b>${rangeStr(lo)}</b></span><span>High <b>${rangeStr(hi)}</b></span></div>
    <div class="meter"><i style="width:${pos}%"></i></div>
    <div class="mlab"><span>90-day low</span><span>today: better than ${pos}%</span><span>high</span></div>`);
}

function gridCard(from, amount, codes) {

/* Five destinations, ranked by how today compares with each pair's own

function suggestCard(from, amount, rows, live) {

  const card = el("card sugg", `
    <div class="sh"><span class="pill">PICK ONE</span> Where ${esc(cash(amount, from))} goes furthest</div>
    <div class="ss">Ranked by how today's rate compares with each pair's own 90-day range — tap one to convert.</div>
    ${body}
    <div class="sfoot">${live ? "Ranges from ECB reference rates." : "Ranges modelled — the live history feed is unreachable."} A high score means this pair is near its own 90-day best, not that the currency is \u201cstrong\u201d.</div>`);
  card.addEventListener("click", e => {
    const b = e.target.closest("[data-dest]");
    if (b && !S.busy) { buzz(); turn_(`convert ${plain(amount)} ${from} to ${b.dataset.dest}`); }

  return card;
}

/* ══════════════════════════════════════════════════════════════
   THE AGENT — one turn
   ══════════════════════════════════════════════════════════════ */
/* "convert · USD→GBP · 2,400 ↺ amount" — the ↺ marks a slot filled from the
   conversation rather than from what was just typed. */
function slots(u, r, label) {
  const carried = [];
  if (u.amount == null) carried.push("amount");
  if (!u.from && !u.to && !u.one) carried.push("pair");
  else if (u.one && !u.from) carried.push("source");
  const base = `${label} · ${r.from}→${r.to} · ${plain(r.amount)}`;
  return carried.length ? `${base} ↺ ${carried.join(" + ")}` : base;
}
function ordinal(n) {
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* Rank the corridors people actually use from this currency. */
async function buildSuggestions(a, from, amount) {
  const dests = topDestinations(from);
  const { series, live } = await multiRange(from, dests);
  await a.step("rank_destinations", `${dests.length} corridors · ${live ? "ECB" : "modelled"}`);
  const rows = dests.map(code => {
    const rate = rateOf(from, code);
    const vals = series[code];
    /* if history is live but spot is not, judge the position against the
       history's own latest point rather than mixing two sources */
    const now = (live && !fx.live) ? vals[vals.length - 1] : rate;
    return { code, rate, pos: position(vals, now) };
  }).sort((x, y) => y.pos - x.pos);
  return { rows, live };
}

const rateNote = () => fx.live ? "mid-market, " + ago(fx.stamp) : "an indicative snapshot — I can't reach the rate feeds right now";

async function turn_(text) {
  if (S.busy) return;
  addUser(text);
  setBusy(true);
  await wait(260);

  const u = understand(text);
  const r = resolve(u);
  const a = beginAgent();

  try {
    switch (u.intent) {

      case "convert":
      case "rate": {
        await a.step("parse_request", slots(u, r, u.intent));
        await loadRates("USD");
        const rate = rateOf(r.from, r.to);
        await a.step("fetch_rates", fx.live ? `${rateStr(rate)} ${r.from}/${r.to}` : "offline snapshot");
        remember(r);
        if (u.intent === "rate" || u.amount == null) {
          await a.say(`One ~${r.from}~ buys *${rateStr(rate)} ${r.to}* — ${rateNote()}.\n\nOn ${cash(r.amount, r.from)} that comes to *${cash(r.amount * rate, r.to)}*.`);
        } else {
          await a.say(`~${cash(r.amount, r.from)}~ comes to *${cash(r.amount * rate, r.to)}*.\n\nThat's the mid-market rate — the number everyone quotes. What you'd actually receive depends on how you move it.`);
        }
        a.attach(convCard(r.from, r.to, r.amount));
        const sug = await buildSuggestions(a, r.from, r.amount);
        a.attach(suggestCard(r.from, r.amount, sug.rows, sug.live));
        a.chips(["What would actually land?", "Is now a good time?", "Show the 90-day trend"]);
        break;
      }

      case "suggest": {
        await a.step("parse_request", `destinations from ${r.from}`);
        await loadRates("USD");
        await a.step("fetch_rates", fx.live ? `${r.from} spot` : "offline snapshot");
        remember(r);
        const sg = await buildSuggestions(a, r.from, r.amount);
        const best = sg.rows[0], worst = sg.rows[sg.rows.length - 1];
        await a.say(
          `These are the five places ~${r.from}~ most often goes, ranked by how today compares with each pair's own ninety-day range.\n\n` +
          `*${best.code}* is the standout — today sits at ~${best.pos}%~ of its 90-day range. ${worst.code} is the weakest of the five at ${worst.pos}%. ` +
          `Tap any of them and I'll convert ${cash(r.amount, r.from)} into it.`);
        a.attach(suggestCard(r.from, r.amount, sg.rows, sg.live));
        a.chips(["What would actually land?", "Is now a good time?", `Convert 5,000 ${r.from}`]);
        break;
      }

      case "route": {
        await a.step("parse_request", slots(u, r, "cost comparison"));
        await loadRates("USD");
        const rate = rateOf(r.from, r.to), conv = r.amount * rate;
        await a.step("fetch_rates", fx.live ? `${rateStr(rate)} ${r.from}/${r.to}` : "offline snapshot");
        await a.step("compare_routes", "5 routes · World Bank baseline");
        remember(r);
        const best = conv * (1 - ROUTES[1].pct / 100), worst = conv * (1 - ROUTES[4].pct / 100);
        await a.say(
          `On ~${cash(r.amount, r.from)}~, a digital transfer lands *${cash(best, r.to)}*. An airport bureau would hand you ${cash(worst, r.to)} — *${cash(best - worst, r.to)} less* for exactly the same money.\n\n` +
          `Use a provider that shows its fee separately from the rate. If a service advertises "zero fees", the margin is inside the rate instead — that's where the global average of *6.36%* comes from.`);
        a.attach(routesCard(r.to, conv));
        a.chips(["Is now a good time?", "Show the 90-day trend", `Convert 5,000 ${r.from}`]);
        break;
      }

      case "timing": {
        await a.step("parse_request", slots(u, r, "timing"));
        await loadRates("USD");
        const rate = rateOf(r.from, r.to);
        await a.step("fetch_rates", fx.live ? `${rateStr(rate)} ${r.from}/${r.to}` : "offline snapshot");
        const h = await history(r.from, r.to);
        await a.step("fetch_history", `90 points · ${h.live ? "ECB" : "modelled"}`);
        const lo = Math.min(...h.vals), hi = Math.max(...h.vals);
        const pos = clamp(Math.round(((rate - lo) / ((hi - lo) || 1)) * 100), 0, 100);
        await a.step("score_position", `${ordinal(pos)} percentile of 90 days`);
        remember(r);

        const upside = r.amount * (hi - rate);
        let line, tone;
        if (pos >= 70) {
          line = `*I'd move it now.* Today beats ~${pos}%~ of the last ninety days, and waiting for the very top would only add about ${cash(upside, r.to)} on this amount — not worth the risk of it slipping back.`;
          tone = "good";
        } else if (pos >= 40) {
          line = `*No strong reason to rush, and no reason to panic.* Today sits at ~${pos}%~ of the last ninety days — middling. If the money isn't needed this week, set a target a couple of percent up and wait. If it is needed, you're not being robbed.`;
          tone = "good";
        } else {
          line = `*I'd wait if you can.* Today is only better than ~${pos}%~ of the last ninety days. At the 90-day high you'd have received about ${cash(upside, r.to)} more on this amount. If the money isn't needed this week, hold.`;
          tone = "warn";
        }
        await a.say(`${r.from}→${r.to} is at ~${rateStr(rate)}~ right now, against a 90-day range of ${rangeStr(lo)} to ${rangeStr(hi)}.`);
        a.attach(trendCard(r.from, r.to, h.vals, h.live));
        a.attach(verdictCard(tokens(line).map(t => t.cls === "b" ? `<b>${esc(t.w)}</b>` : t.cls === "hl" ? `<span class="hl">${esc(t.w)}</span>` : esc(t.w)).join(""), tone === "warn" ? "warn" : ""));
        a.chips(["What would actually land?", `Watch ${r.to}`, "Show the 90-day trend"]);
        break;
      }

      case "trend": {
        await a.step("parse_request", slots(u, r, "trend"));
        await loadRates("USD");
        const rate = rateOf(r.from, r.to);
        await a.step("fetch_rates", fx.live ? `${rateStr(rate)} ${r.from}/${r.to}` : "offline snapshot");
        const h = await history(r.from, r.to);
        await a.step("fetch_history", `90 points · ${h.live ? "ECB" : "modelled"}`);
        remember(r);
        const lo = Math.min(...h.vals), hi = Math.max(...h.vals);
        const chg = ((h.vals[h.vals.length - 1] - h.vals[0]) / h.vals[0]) * 100;
        const swing = ((hi - lo) / lo) * 100;
        await a.say(
          `Over ninety days ${r.from}→${r.to} has moved *${chg >= 0 ? "up" : "down"} ${Math.abs(chg).toFixed(2)}%*, between ${rangeStr(lo)} and ${rangeStr(hi)}.\n\n` +
          `That's a ~${swing.toFixed(1)}%~ swing top to bottom — ${swing < 3 ? "a quiet pair, so timing matters less than picking the right route" : swing < 7 ? "enough movement that a few days' patience can be worth real money" : "a volatile stretch, so the day you move matters as much as the method"}.`);
        a.attach(trendCard(r.from, r.to, h.vals, h.live));
        a.chips(["Is now a good time?", "What would actually land?", `Watch ${r.to}`]);
        break;
      }

      case "compare": {
        const targets = (u.others && u.others.length ? [r.to].concat(u.others) : [r.to].concat(S.watch)).filter((v, i, x) => x.indexOf(v) === i);
        await a.step("parse_request", `compare · ${r.from} → ${targets.length} currencies`);
        await loadRates("USD");
        await a.step("fetch_rates", fx.live ? `${targets.length} pairs` : "offline snapshot");
        remember(r);
        await a.say(`Here's ~${cash(r.amount, r.from)}~ across ${targets.length === 1 ? "that currency" : `all ${targets.length}`}, at ${rateNote()}.`);
        a.attach(gridCard(r.from, r.amount, targets));
        a.chips(["What would actually land?", "Is now a good time?", "Show my watchlist"]);
        break;
      }

      case "watchAdd": {
        const add = u.codes.filter(c => c !== r.from && !S.watch.includes(c));
        await a.step("parse_request", `watchlist · add ${u.codes.join(", ") || "—"}`);
        S.watch = S.watch.concat(add); store.set("watch", S.watch);
        await a.step("update_watchlist", `${S.watch.length} currencies`);
        await loadRates("USD");
        remember(r);
        await a.say(add.length
          ? `Added *${add.join(", ")}*. I'll keep ${add.length > 1 ? "them" : "it"} against ~${cash(r.amount, r.from)}~.`
          : `${u.codes.join(", ") || "That"} is already on your watchlist.`);
        a.attach(gridCard(r.from, r.amount, S.watch));
        a.chips(["Is now a good time?", "What would actually land?", "Show my watchlist"]);
        break;
      }

      case "watchDel": {
        const gone = u.codes.filter(c => S.watch.includes(c));
        await a.step("parse_request", `watchlist · remove ${u.codes.join(", ") || "—"}`);
        S.watch = S.watch.filter(c => !u.codes.includes(c)); store.set("watch", S.watch);
        await a.step("update_watchlist", `${S.watch.length} currencies`);
        await a.say(gone.length ? `Removed *${gone.join(", ")}*.` : `That wasn't on the list, so nothing to remove.`);
        a.attach(gridCard(r.from, r.amount, S.watch));
        a.chips(["Show my watchlist", "Is now a good time?"]);
        break;
      }

      case "showList": {
        await a.step("parse_request", "watchlist");
        await loadRates("USD");
        await a.step("fetch_rates", fx.live ? `${S.watch.length} pairs` : "offline snapshot");
        await a.say(S.watch.length
          ? `Your watchlist against ~${cash(r.amount, r.from)}~:`
          : `Your watchlist is empty. Tell me something like "watch the yen" and I'll start tracking it.`);
        if (S.watch.length) a.attach(gridCard(r.from, r.amount, S.watch));
        a.chips(["Watch the Swiss franc", "Is now a good time?", "What would actually land?"]);
        break;
      }

      case "help": {
        await a.step("parse_request", "capabilities");
        await a.say(
          `I'm a currency agent. Ask me in your own words — I'll work out what you mean, fetch what I need, and tell you what I'd do.\n\n` +
          `I can *convert* any amount — name a currency, a country or a city, whichever comes to mind. I show *what actually lands* after each kind of transfer, rank the *five places your money goes furthest* today, read the *90-day trend*, say whether *now is a good time*, and keep a *watchlist*. I remember the pair we're on, so "what about pounds?" just works.`);
        a.chips(["Convert 2,400 USD to INR", "Where does my money go furthest?", "1,000 dollars in Germany", "Watch the yen"]);
        break;
      }

      case "greet": {
        await a.step("parse_request", "greeting");
        await loadRates("USD");
        remember(r);
        await a.say(`Hello. We were last looking at ~${r.from}→${r.to}~ — want the current number, or something else?`);
        a.chips([`Convert 1,000 ${r.from} to ${r.to}`, "Is now a good time?", "What can you do?"]);
        break;
      }

      default: {
        await a.step("parse_request", "no currency found");
        await a.say(
          `I didn't catch a currency in that. I work best when there's an amount and a currency in the question — names, codes, countries or symbols all work.\n\n` +
          `Try something like *"how much is 2,400 dollars in rupees"* or *"should I send money to Nigeria this week"*.`);
        a.chips(["Convert 1,000 USD to INR", "What can you do?", "Is now a good time?"]);
      }
    }
  } catch (err) {
    await a.say(`Something went wrong working that out — ${esc(err.message)}. Try asking again, or rephrase it.`);
  }

  setBusy(false);
  $("#input").focus();
}

/* ══════════════════════════════════════════════════════════════
   OPENING — proactive, based on what happened last time
   ══════════════════════════════════════════════════════════════ */
async function open_() {
  setBusy(true);
  const a = beginAgent();
  await a.step("wake", "restoring session");
  await loadRates("USD");
  const { from, to, amount } = S.ctx;
  const rate = rateOf(from, to);
  await a.step("fetch_rates", fx.live ? `${rateStr(rate)} ${from}/${to}` : "offline snapshot");

  const last = store.get("lastRate", null);
  const seen = store.get("lastPair", null);
  const returning = seen === from + to && typeof last === "number" && rate;
  const move = returning ? ((rate - last) / last) * 100 : 0;

  if (returning && Math.abs(move) >= 0.25) {
    await a.step("compare_to_last_visit", `${move >= 0 ? "+" : ""}${move.toFixed(2)}% since`);
    const diff = Math.abs(amount * (rate - last));
    await a.say(
      `Welcome back. Since you were last here ~${from}→${to}~ has moved *${move >= 0 ? "up" : "down"} ${Math.abs(move).toFixed(2)}%* — ` +
      `on ${cash(amount, from)} that's about *${cash(diff, to)} ${move >= 0 ? "more" : "less"}* than last time.`);
    a.attach(convCard(from, to, amount));
    a.chips(["Is now a good time?", "Where does my money go furthest?", "What would actually land?"]);
  } else if (returning) {
    await a.say(`Welcome back. ~${from}→${to}~ is *${rateStr(rate)}* — barely moved since your last visit.`);
    a.attach(convCard(from, to, amount));
    a.chips(["Is now a good time?", "What would actually land?", `Convert 5,000 ${from}`]);
  } else {
    await a.say(
      `I'm Currenzy — a currency agent. Ask me in plain language and I'll fetch what I need, show my working, and tell you what I'd do.\n\n` +
      `Right now ~${from}→${to}~ is *${rateStr(rate)}*, ${rateNote()}.`);
    a.chips(["Convert 1,000 USD to INR", "Where does my money go furthest?", "Is now a good time?", "What can you do?"]);
  }

  if (rate) { store.set("lastRate", rate); store.set("lastPair", from + to); }
  setBusy(false);
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
const EXAMPLES = [
  ["Converting", [
    ["How much is 2,400 dollars in rupees?", "amount + currency names"],
    ["500 euros to yen", "codes, names or symbols"],
    ["₹50,000 in pounds", "symbols work too"],
    ["1,000 dollars in Germany", "name a country instead of a currency"],
    ["Convert 50,000 rupees to Dubai", "cities work as well"]
  ]],
  ["Choosing", [
    ["Where does my money go furthest?", "top five destinations, ranked"],
    ["What are my options from USD?", "tap a suggestion to convert"]
  ]],
  ["Deciding", [
    ["What would actually land?", "five routes, loss in cash"],
    ["Is now a good time to send money?", "90-day position, with a recommendation"],
    ["Should I wait to convert to GBP?", "it will tell you plainly"]
  ]],
  ["Watching", [
    ["Show the 90-day trend", "chart plus a plain-language read"],
    ["Watch the Swiss franc", "adds it to your list"],
    ["Show my watchlist", "one amount, every currency"]
  ]],
  ["Following up", [
    ["What about pounds?", "keeps the amount from before"],
    ["And in Japan?", "countries count as currencies"]
  ]]
];

function applyTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", mode === "light" ? "#F5F8F6" : "#0B0F0E");
}

function init() {
  const saved = store.get("theme", null);
  applyTheme(saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));

  $("#helpBody").innerHTML = EXAMPLES.map(([group, items]) =>
    `<div class="exh">${esc(group)}</div>` + items.map(([q, why]) =>
      `<button class="exl" data-q="${esc(q)}">${esc(q)}<span>${esc(why)}</span></button>`).join("")).join("");

  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#input").value.trim();
    if (!v || S.busy) return;
    $("#input").value = "";
    $("#send").disabled = true;
    buzz();
    turn_(v);
  });
  $("#input").addEventListener("input", e => { $("#send").disabled = S.busy || !e.target.value.trim(); });

  $("#helpBtn").onclick = () => { buzz(); $("#helpScrim").classList.add("on"); };
  $("#helpScrim").addEventListener("click", e => {
    if (e.target === $("#helpScrim")) $("#helpScrim").classList.remove("on");
    const b = e.target.closest("[data-q]");
    if (b) { $("#helpScrim").classList.remove("on"); buzz(); turn_(b.dataset.q); }
  });

  $("#themeBtn").onclick = () => {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(next); store.set("theme", next); buzz();
  };
  $("#resetBtn").onclick = () => {
    if (S.busy) return;
    thread().innerHTML = ""; buzz(); toast("Fresh start"); open_();
  };

  /* stop auto-scrolling the moment the reader scrolls up to re-read something */
  thread().addEventListener("scroll", () => {
    const t = thread();
    pinned = t.scrollHeight - t.scrollTop - t.clientHeight < 60;
  }, { passive:true });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") $("#helpScrim").classList.remove("on");
  });

  paintStatus();
  open_();
}

document.addEventListener("DOMContentLoaded", init);

/* Installable, and it opens with no signal — the moment a currency agent is
   most useful. Registration is best-effort: opened from a file:// path or a
   browser without support, the app simply runs as a normal page. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    const had = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!had || reloaded) return;               // first install must not reload
      reloaded = true;
      location.reload();                          // a new build took over
    });
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

</script>
